<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>OneCoNet — Software &amp; IT Solutions</title>
  <meta name="description" content="OneCoNet provides software and IT solutions through various fields." />
  <meta name="theme-color" content="#000000" />
  <style>
    /* Simple, honest, dark landing page */
    :root{--bg:#000;--text:#e6e6e6;--muted:#9a9a9a;--accent:#1db954;font-family:Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial}
    html,body{height:100%;margin:0}
    body{background:var(--bg);color:var(--text);display:flex;align-items:center;justify-content:center;font-family:var(--font);-webkit-font-smoothing:antialiased}
    .wrap{max-width:780px;padding:48px;text-align:center}
    h1{margin:0 0 14px;font-weight:600;font-size:28px}
    p{margin:0 0 22px;color:var(--muted);line-height:1.6}
    a.btn{display:inline-block;padding:12px 18px;border-radius:8px;background:var(--accent);color:#000;text-decoration:none;font-weight:700}
    footer{margin-top:36px;color:var(--muted);font-size:13px}
    @media (max-width:520px){.wrap{padding:28px}h1{font-size:22px}}
  </style>
</head>
<body>
  <main class="wrap" role="main">
    <h1>OneCoNet</h1>
    <p>OneCoNet provides software and IT solutions through various fields. We keep things practical and focus on delivering what matters.</p>

    <p><a class="btn" href="mailto:service@oneconet.com">Contact — service@oneconet.com</a></p>

    <footer>
      © <span id="year"></span> OneCoNet — All rights reserved.
    </footer>
  </main>

  <script>document.getElementById('year').textContent = new Date().getFullYear();</script>
</body>
</html>
